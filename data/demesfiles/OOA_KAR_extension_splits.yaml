description: The Gutenkunst et al. (2009) OOA model.
doi:
- https://doi.org/10.1371/journal.pgen.1000695
time_units: years
generation_time: 25

demes:
- name: ancestral
  description: Equilibrium/root population
  epochs:
  - {end_time: 220e3, start_size: 7300}
- name: AMH
  description: Anatomically modern humans
  ancestors: [ancestral]
  epochs:
  - {end_time: 140e3, start_size: 12300}
- name: OOA
  description: Bottleneck out-of-Africa population
  ancestors: [AMH]
  epochs:
  - {end_time: 21.2e3, start_size: 2100}
- name: YRI
  description: Yoruba in Ibadan, Nigeria
  ancestors: [AMH]
  epochs:
  - start_size: 12300
- name: YRIS
  description: Yoruba in Ibadan, Nigeria - Split
  ancestors: [YRI]
  start_time: 75  
  epochs:
  - {start_size: 12300}
- name: CEU
  description: Utah Residents (CEPH) with Northern and Western European Ancestry
  ancestors: [OOA]
  epochs:
  - {start_size: 1000, end_size: 29725}
- name: CEUS
  description: Utah Residents (CEPH) with Northern and Western European Ancestry - Split
  ancestors: [CEU]
  start_time: 75
  epochs:
  - {start_size: 29725}
- name: CHB
  description: Han Chinese in Beijing, China
  ancestors: [OOA]
  epochs:
  - {start_size: 510, end_size: 54090}
- name: CHBS
  description: Han Chinese in Beijing, China - Split
  ancestors: [CHB]
  start_time: 75
  epochs:
  - {start_size: 54090}
- name: KAR
  description: Karitiana native Brazilians
  ancestors: [CHB]
  start_time: 15000
  #https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5116069/
  epochs:
  - {start_size: 13975, end_size: 6006}
- name: KARS
  description: Karitiana native Brazilians - Split
  ancestors: [KAR]
  start_time: 75
  epochs:
  - {start_size: 6006}

migrations:
- {demes: [YRI, OOA], rate: 25e-5}
- {demes: [YRI, CEU], rate: 3e-5}
- {demes: [YRI, CHB], rate: 1.9e-5}
- {demes: [CEU, CHB], rate: 9.6e-5}
